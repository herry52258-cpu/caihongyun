# Build the Windows installer and keep it as a workflow artifact.
# This file does not create tags, GitHub Releases, or update manifests.
name: Windows installer (no release)

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/panel-hosts-1.0.31-5143

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download mihomo core
        run: node scripts/prebuild.mjs x86_64-pc-windows-msvc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare updater signing key
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $keyPath = Join-Path (Get-Location) 'updater.key'
          if ($env:SIGNING_KEY) {
            Set-Content -Path $keyPath -Value $env:SIGNING_KEY -NoNewline
            $password = $env:SIGNING_PASSWORD
          } else {
            pnpm tauri signer generate --ci --password ci-test -w $keyPath | Out-Null
            $password = 'ci-test'
          }
          "TAURI_SIGNING_PRIVATE_KEY=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Windows installer
        run: pnpm tauri build --target x86_64-pc-windows-msvc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checksum installer
        shell: pwsh
        run: |
          $dirs = @(
            'target/x86_64-pc-windows-msvc/release/bundle/nsis',
            'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          )
          $files = foreach ($dir in $dirs) {
            if (Test-Path $dir) { Get-ChildItem -Path $dir -Filter *.exe }
          }
          if (-not $files) { throw 'installer was not produced' }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $lines | Tee-Object -FilePath nsis-sha256.txt

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: caihongyun-windows-1.0.31
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            nsis-sha256.txt
          if-no-files-found: error
          retention-days: 14
